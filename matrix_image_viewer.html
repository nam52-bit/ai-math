<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3x3 이미지 시각화 통합 프로그램</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .row {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .panel {
            flex: 1;
            min-width: 520px;
            background: #f9fbfc;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
        }
        h2 {
            font-size: 1.25rem;
            color: #34495e;
            margin-top: 0;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
            text-align: center;
        }
        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-width: 180px;
            margin: 0 auto;
        }
        .matrix-grid input {
            width: 100%;
            padding: 8px 4px;
            text-align: center;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .rgb-sub-inputs {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .rgb-sub-box {
            background: #ffffff;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            padding: 12px;
            flex: 1;
            min-width: 150px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
            display: block;
            margin: 15px auto 0 auto;
        }
        button:hover {
            background-color: #2980b9;
        }
        .result-container {
            text-align: center;
            margin-top: 20px;
            background: #fff;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #eaeaea;
        }
        canvas {
            border: 4px solid #2c3e50;
            border-radius: 4px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 130px;
            height: 130px;
            background-color: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .preset-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .preset-btn {
            background: #95a5a6;
            font-size: 0.8rem;
            padding: 5px 10px;
            margin: 0;
        }
        .preset-btn:hover {
            background: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎨 3×3 이미지 시각화 통합 프로그램</h1>
    <p class="subtitle">컬러(RGB) 행렬과 단일(R=G=B) 행렬을 한 화면에서 비교하고 실습해 보세요!</p>

    <div class="row">
        <!-- 패널 1: RGB 컬러 이미지 -->
        <div class="panel">
            <h2>1. R, G, B 행렬 (컬러 이미지)</h2>
            <div class="rgb-sub-inputs">
                <!-- R Matrix -->
                <div class="rgb-sub-box">
                    <h4 style="color: #e74c3c; text-align: center; margin: 0 0 10px 0;">Red 행렬</h4>
                    <div class="matrix-grid" id="r-grid">
                        <input type="number" min="0" max="255" value="255"><input type="number" min="0" max="255" value="0"><input type="number" min="0" max="255" value="0">
                        <input type="number" min="0" max="255" value="0"><input type="number" min="0" max="255" value="255"><input type="number" min="0" max="255" value="0">
                        <input type="number" min="0" max="255" value="0"><input type="number" min="0" max="255" value="0"><input type="number" min="0" max="255" value="255">
                    </div>
                </div>
                <!-- G Matrix -->
                <div class="rgb-sub-box">
                    <h4 style="color: #2ecc71; text-align: center; margin: 0 0 10px 0;">Green 행렬</h4>
                    <div class="matrix-grid" id="g-grid">
                        <input type="number" min="0" max="255" value="0"><input type="number" min="0" max="255" value="255"><input type="number" min="0" max="255" value="0">
                        <input type="number" min="0" max="255" value="255"><input type="number" min="0" max="255" value="0"><input type="number" min="0" max="255" value="0">
                        <input type="number" min="0" max="255" value="0"><input type="number" min="0" max="255" value="255"><input type="number" min="0" max="255" value="0">
                    </div>
                </div>
                <!-- B Matrix -->
                <div class="rgb-sub-box">
                    <h4 style="color: #3498db; text-align: center; margin: 0 0 10px 0;">Blue 행렬</h4>
                    <div class="matrix-grid" id="b-grid">
                        <input type="number" min="0" max="255" value="0"><input type="number" min="0" max="255" value="0"><input type="number" min="0" max="255" value="255">
                        <input type="number" min="0" max="255" value="0"><input type="number" min="0" max="255" value="255"><input type="number" min="0" max="255" value="0">
                        <input type="number" min="0" max="255" value="255"><input type="number" min="0" max="255" value="0"><input type="number" min="0" max="255" value="0">
                    </div>
                </div>
            </div>
            <div class="preset-buttons">
                <button class="preset-btn" onclick="setRgbPreset('diagonal')">대각선 패턴</button>
                <button class="preset-btn" onclick="setRgbPreset('gradient')">그라데이션 패턴</button>
            </div>
            <button onclick="drawRgbImage()">RGB 이미지 출력하기</button>
            
            <div class="result-container">
                <h4 style="margin: 0 0 10px 0; color: #2c3e50;">출력된 컬러 이미지</h4>
                <canvas id="rgbCanvas" width="3" height="3"></canvas>
            </div>
        </div>

        <!-- 패널 2: R=G=B 단일 행렬 -->
        <div class="panel">
            <h2>2. R = G = B 행렬 (명암 이미지)</h2>
            <div style="margin: 15px auto; max-width: 200px; background: #ffffff; border: 1px solid #dcdde1; border-radius: 6px; padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.05);">
                <h4 style="color: #2c3e50; text-align: center; margin: 0 0 10px 0;">단일 행렬 (0 ~ 255)</h4>
                <div class="matrix-grid" id="single-grid">
                    <input type="number" min="0" max="255" value="50"><input type="number" min="0" max="255" value="100"><input type="number" min="0" max="255" value="150">
                    <input type="number" min="0" max="255" value="100"><input type="number" min="0" max="255" value="200"><input type="number" min="0" max="255" value="250">
                    <input type="number" min="0" max="255" value="150"><input type="number" min="0" max="255" value="200"><input type="number" min="0" max="255" value="255">
                </div>
            </div>
            <div class="preset-buttons">
                <button class="preset-btn" onclick="setSinglePreset('grayscale')">명암 계단식</button>
                <button class="preset-btn" onclick="setSinglePreset('center')">중앙 집중형</button>
            </div>
            <button onclick="drawSingleImage()">단일 행렬 이미지 출력하기</button>

            <div class="result-container">
                <h4 style="margin: 0 0 10px 0; color: #2c3e50;">출력된 명암(Grayscale) 이미지</h4>
                <canvas id="singleCanvas" width="3" height="3"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    function getValues(gridId) {
        const inputs = document.querySelectorAll(`#${gridId} input`);
        let arr = [];
        for (let i = 0; i < 3; i++) {
            let row = [];
            for (let j = 0; j < 3; j++) {
                let val = parseInt(inputs[i * 3 + j].value);
                row.push(isNaN(val) ? 0 : Math.min(255, Math.max(0, val)));
            }
            arr.push(row);
        }
        return arr;
    }

    function drawRgbImage() {
        const R = getValues('r-grid');
        const G = getValues('g-grid');
        const B = getValues('b-grid');

        const canvas = document.getElementById('rgbCanvas');
        const ctx = canvas.getContext('2d');
        const imgData = ctx.createImageData(3, 3);

        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                const idx = (i * 3 + j) * 4;
                imgData.data[idx]     = R[i][j]; // R
                imgData.data[idx + 1] = G[i][j]; // G
                imgData.data[idx + 2] = B[i][j]; // B
                imgData.data[idx + 3] = 255;     // Alpha
            }
        }
        ctx.putImageData(imgData, 0, 0);
    }

    function drawSingleImage() {
        const M = getValues('single-grid');

        const canvas = document.getElementById('singleCanvas');
        const ctx = canvas.getContext('2d');
        const imgData = ctx.createImageData(3, 3);

        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                const idx = (i * 3 + j) * 4;
                const val = M[i][j];
                imgData.data[idx]     = val; // R
                imgData.data[idx + 1] = val; // G
                imgData.data[idx + 2] = val; // B
                imgData.data[idx + 3] = 255; // Alpha
            }
        }
        ctx.putImageData(imgData, 0, 0);
    }

    function setRgbPreset(type) {
        const rInputs = document.querySelectorAll('#r-grid input');
        const gInputs = document.querySelectorAll('#g-grid input');
        const bInputs = document.querySelectorAll('#b-grid input');

        if (type === 'diagonal') {
            const rVals = [255,0,0, 0,255,0, 0,0,255];
            const gVals = [0,255,0, 255,0,0, 0,0,255];
            const bVals = [0,0,255, 0,255,0, 255,0,0];
            rInputs.forEach((inp, idx) => inp.value = rVals[idx]);
            gInputs.forEach((inp, idx) => inp.value = gVals[idx]);
            bInputs.forEach((inp, idx) => inp.value = bVals[idx]);
        } else if (type === 'gradient') {
            const rVals = [100,150,200, 120,170,220, 140,190,240];
            const gVals = [50,100,150, 80,130,180, 110,160,210];
            const bVals = [200,180,160, 220,200,180, 240,220,200];
            rInputs.forEach((inp, idx) => inp.value = rVals[idx]);
            gInputs.forEach((inp, idx) => inp.value = gVals[idx]);
            bInputs.forEach((inp, idx) => inp.value = bVals[idx]);
        }
        drawRgbImage();
    }

    function setSinglePreset(type) {
        const inputs = document.querySelectorAll('#single-grid input');
        if (type === 'grayscale') {
            const vals = [20, 50, 90, 120, 160, 190, 210, 240, 255];
            inputs.forEach((inp, idx) => inp.value = vals[idx]);
        } else if (type === 'center') {
            const vals = [200, 200, 200, 200, 255, 200, 200, 200, 200];
            inputs.forEach((inp, idx) => inp.value = vals[idx]);
        }
        drawSingleImage();
    }

    window.onload = function() {
        drawRgbImage();
        drawSingleImage();
    };
</script>

</body>
</html>
